name: Publish Partyjniak Content Studio
on:
  push:
    branches:
      - main
      - feature/content-studio-supabase
    paths:
      - 'admin/**'
      - '.github/workflows/publish-content-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: partyjniak-content-studio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync statically hosted editor to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio"
          for file in index.html studio.css studio.js config.js; do
            test -s "admin/$file"
            cp "admin/$file" "$RUNNER_TEMP/studio/$file"
          done
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp "$RUNNER_TEMP"/studio/* .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html studio.css studio.js config.js .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish Content Studio from ${GITHUB_SHA::8}"
            git push origin HEAD:gh-pages
          fi
