name: Quality Checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Node test suite
        run: npm test
      - name: Build web bundle
        run: npm run build:web

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: npm run test:e2e

  android-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-and-build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare web bundle
        run: npm run build:web
      - name: Create Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Verify Capacitor packaged web bundle
        run: node scripts/verify-web-bundle.mjs android/app/src/main/assets/public
      - name: Apply Partyjniak Android settings
        run: node scripts/patch-android.mjs
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify runtime inside APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" assets/public/index.html > /tmp/partyjniak-apk-index.html
          grep -q 'data-partyjniak-runtime="inline"' /tmp/partyjniak-apk-index.html
          grep -q -- '--partyjniak-runtime-bundle:ready' /tmp/partyjniak-apk-index.html
          grep -q 'Font Awesome 6 Free' /tmp/partyjniak-apk-index.html
          grep -q 'data:font/woff2;base64,' /tmp/partyjniak-apk-index.html
          if grep -q 'assets/vendor/' /tmp/partyjniak-apk-index.html; then
            echo 'APK still depends on assets/vendor' >&2
            exit 1
          fi
          unzip -l "$APK" assets/public/assets/js/phaser.min.js > /tmp/partyjniak-phaser-entry.txt
          grep -q 'assets/public/assets/js/phaser.min.js' /tmp/partyjniak-phaser-entry.txt
