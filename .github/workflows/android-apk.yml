name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Prepare web bundle
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Capacitor packaged web bundle
        run: node scripts/verify-web-bundle.mjs android/app/src/main/assets/public

      - name: Apply Partyjniak Android settings
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify runtime inside APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          INDEX="$(unzip -p "$APK" assets/public/index.html)"
          printf '%s' "$INDEX" | grep -q 'data-partyjniak-runtime="inline"'
          printf '%s' "$INDEX" | grep -q -- '--partyjniak-runtime-bundle:ready'
          printf '%s' "$INDEX" | grep -q 'Font Awesome 6 Free'
          printf '%s' "$INDEX" | grep -q 'data:font/woff2;base64,'
          if printf '%s' "$INDEX" | grep -q 'assets/vendor/'; then
            echo 'APK still depends on assets/vendor' >&2
            exit 1
          fi
          unzip -l "$APK" assets/public/assets/js/phaser.min.js | grep -q 'assets/public/assets/js/phaser.min.js'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: partyjniak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
