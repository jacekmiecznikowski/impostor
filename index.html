<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Partyjniak – gry imprezowe</title>
  <meta name="theme-color" content="#020617">
  <meta name="description" content="Partyjniak – mobilne gry imprezowe na jeden telefon.">
  <link rel="manifest" href="./manifest.webmanifest">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e' },
            accent: { 500: '#06b6d4', 600: '#0891b2' },
            impostor: { 500: '#f43f5e', 600: '#e11d48' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/impostor.css">
  <link rel="stylesheet" href="./assets/css/impostor-reveal.css">
  <link rel="stylesheet" href="./assets/css/impostor-role.css">
  <link rel="stylesheet" href="./assets/css/partyjniak.css">
  <link rel="stylesheet" href="./assets/css/navigation.css">
  <link rel="stylesheet" href="./assets/css/navigation-android.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 overflow-x-hidden relative flex flex-col antialiased">
  <div id="phaser-bg" class="fixed inset-0 pointer-events-auto z-0 opacity-70"></div>
  <header id="app-shell" class="app-shell"></header>
  <main id="app-main" class="relative z-10 flex-1 flex flex-col max-w-lg w-full mx-auto p-4 md:p-6 overflow-y-auto"></main>
  <div id="modal-root"></div>

  <script src="./assets/js/shared/view-loader.js" defer></script>
  <script src="./assets/js/shared/audio.js" defer></script>
  <script src="./assets/js/shared/background.js" defer></script>
  <script src="./assets/js/shared/platform.js" defer></script>
  <script src="./assets/js/shared/content-repository.js" defer></script>
  <script src="./assets/js/games/impostor/data.js" defer></script>
  <script src="./assets/js/games/impostor/content-provider.js" defer></script>
  <script src="./assets/js/games/impostor/rules.js" defer></script>
  <script src="./assets/js/games/impostor/state.js" defer></script>
  <script src="./assets/js/games/impostor/setup.js" defer></script>
  <script src="./assets/js/games/impostor/game.js" defer></script>
  <script src="./assets/js/games/impostor/presentation.js" defer></script>
  <script src="./assets/js/games/impostor/scoreboard.js" defer></script>
  <script src="./assets/js/shared/ui.js" defer></script>
  <script src="./assets/js/shared/hub.js" defer></script>
  <script src="./assets/js/shared/navigation-behavior.js" defer></script>
  <script src="./assets/js/app.js" defer></script>
</body>
</html>
